[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "poisson-odds"
version = "0.2.0"
authors = [
    {name = "Nikolai Tolmachev", email = "nikolai.tolmachev@gmail.com"}
]
description = "Poisson Odds — a Python library for calculating sports betting probabilities and fair odds using the Poisson distribution based on team qualities."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "poisson",
    "probability",
    "statistics",
    "sports betting",
    "fair odds",
    "football",
    "hockey",
    "betting markets",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tabulate",
]

[project.urls]
Homepage = "https://github.com/nikolaitolmachev/poisson-odds"
Repository = "https://github.com/nikolaitolmachev/poisson-odds"
Issues = "https://github.com/nikolaitolmachev/poisson-odds/issues"

[tool.setuptools]
packages = ["poisson_odds"]
